name: Inspect George (read only)
on:
  workflow_dispatch:
    inputs:
      report_public_key:
        description: 'Optional public encryption key for a private notes report'
        type: string
      since:
        description: 'Inspection window start (UTC ISO timestamp)'
        default: '2026-10-17T12:46:40Z'
        type: string
      until:
        description: 'Inspection window end (UTC ISO timestamp)'
        default: '2026-10-17T12:47:30Z'
        type: string
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Inspect metadata without reading Telegram or calling OpenAI
        run: python inspect_state.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GH_STATE_TOKEN: ${{ github.token }}
          INSPECT_SINCE: ${{ inputs.since }}
          INSPECT_UNTIL: ${{ inputs.until }}
          REPORT_PUBLIC_KEY: ${{ inputs.report_public_key }}
