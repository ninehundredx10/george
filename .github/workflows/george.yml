name: George
on:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
    paths: ['george.py', 'requirements.txt', '.github/workflows/george.yml']
  workflow_dispatch:
    inputs:
      pairing_code:
        description: 'One-time code George sent to your private Telegram chat'
        required: false
        type: string
      force_wake:
        description: 'Wake now, even if George chose to sleep'
        default: false
        type: boolean
      initialize:
        description: 'Allow FIRST state creation only; never use to recover lost state'
        default: false
        type: boolean
permissions:
  contents: write
concurrency:
  group: george-single-writer
  cancel-in-progress: false
jobs:
  awaken:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Check Telegram and George's chosen wake time
        run: python george.py
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GH_STATE_TOKEN: ${{ github.token }}
          PAIRING_CODE: ${{ inputs.pairing_code }}
          FORCE_WAKE: ${{ inputs.force_wake }}
          ALLOW_INITIALIZE: ${{ inputs.initialize }}
